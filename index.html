<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunlap vocab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfaf6; --ink: #17203a; --ink-soft: #5c6482; --rule: #d9d6cc;
    --blue: #1f4fd8; --blue-soft: #e4ebfb; --marker: #f7e35c;
    --ok: #1c7c4e; --ok-soft: #e0f3e8; --bad: #b3312d; --bad-soft: #fbe6e4;
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body { margin: 0; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; color: var(--ink); font-size: 18px; line-height: 1.5; }
  main { max-width: 600px; margin: 0 auto; padding: 28px 20px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .count { font-size: 15px; color: var(--ink-soft); }

  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; margin: 24px 0 8px; border-bottom: 2px solid var(--rule); }
  .modes button { font: inherit; font-size: 17px; font-weight: 700; color: var(--ink-soft); background: none; border: 0; padding: 12px 8px 10px; cursor: pointer; margin-bottom: -2px; border-bottom: 3px solid transparent; }
  .modes button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--blue); }
  button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .rules { font-size: 15px; color: var(--ink-soft); margin: 0 0 20px; }

  .meta { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); margin-bottom: 10px; }
  .bar { height: 5px; background: var(--rule); border-radius: 3px; overflow: hidden; margin-bottom: 22px; }
  .bar div { height: 100%; background: var(--blue); width: 0; transition: width .25s; }

  .prompt { margin: 0 0 6px; }
  .pos { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; }
  .word { display: inline; font-size: 40px; font-weight: 700; line-height: 1.15; letter-spacing: -0.01em; background: linear-gradient(transparent 62%, var(--marker) 62%, var(--marker) 92%, transparent 92%); padding: 0 2px; }
  .definition { font-size: 24px; line-height: 1.4; margin: 0 0 20px; }
  .reveal-def { font-size: 17px; color: var(--ink-soft); margin: 14px 0 0; padding: 12px 14px; border-left: 3px solid var(--marker); background: #fff; }

  textarea, input[type=text] { width: 100%; font: inherit; color: var(--ink); background: #fff; border: 2px solid var(--rule); border-radius: 8px; padding: 12px 14px; }
  textarea { min-height: 96px; resize: vertical; }
  textarea:focus, input[type=text]:focus { border-color: var(--blue); }

  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; border-radius: 8px; padding: 10px 18px; border: 2px solid var(--ink); background: #fff; color: var(--ink); }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.quiet { border-color: var(--rule); color: var(--ink-soft); font-weight: 400; }
  .btn:active { transform: translateY(1px); }

  .fb { margin-top: 14px; padding: 12px 14px; border-radius: 8px; font-size: 16px; display: none; }
  .fb.ok { display: block; background: var(--ok-soft); color: var(--ok); }
  .fb.bad { display: block; background: var(--bad-soft); color: var(--bad); }
  .fb.note { display: block; background: var(--blue-soft); color: var(--blue); }

  .summary h2 { font-size: 20px; margin: 0 0 8px; }
  .summary p { margin: 0 0 12px; }
  .sentences { list-style: none; padding: 0; margin: 16px 0; }
  .sentences li { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 16px; }
  .sentences li b { color: var(--blue); }

  .word-list { list-style: none; padding: 0; margin: 0; }
  .word-list li { padding: 10px 0; border-top: 1px solid var(--rule); font-size: 16px; }
  .word-list li:last-child { border-bottom: 1px solid var(--rule); }
  .word-list b { display: block; }
  .word-list span { color: var(--ink-soft); }
  .hidden { display: none; }
  footer { margin-top: 48px; font-size: 13px; color: var(--ink-soft); }
  @media (max-width: 480px) { .word { font-size: 32px; } .definition { font-size: 21px; } body { font-size: 17px; } .modes button { font-size: 15px; } }
  @media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Dunlap vocab</h1>
    <span class="count" id="count"></span>
  </header>

  <div class="modes" role="tablist">
    <button role="tab" id="tabRegular" aria-selected="true">Regular</button>
    <button role="tab" id="tabRound" aria-selected="false">Go round</button>
    <button role="tab" id="tabList" aria-selected="false">Word list</button>
  </div>
  <p class="rules" id="rules"></p>

  <section id="quiz">
    <div class="meta"><span id="prog"></span><span id="score"></span></div>
    <div class="bar"><div id="bar"></div></div>
    <div id="play">
      <p class="pos" id="pos"></p>
      <p class="prompt" id="prompt"></p>
      <div id="regularUI">
        <textarea id="sentence" placeholder="Write a sentence that uses this word" aria-label="Your sentence"></textarea>
        <div class="row">
          <button class="btn primary" id="checkSentence">Check</button>
          <button class="btn quiet" id="peekDef">Show definition</button>
          <button class="btn quiet" id="skipWord">Skip</button>
        </div>
        <div class="reveal-def hidden" id="defBox"></div>
      </div>
      <div id="roundUI" class="hidden">
        <input type="text" id="guess" placeholder="Type the word" autocomplete="off" spellcheck="false" aria-label="Your guess">
        <div class="row">
          <button class="btn primary" id="checkGuess">Check</button>
          <button class="btn quiet" id="revealWord">Reveal</button>
        </div>
      </div>
      <div class="fb" id="fb" aria-live="polite"></div>
      <div class="row"><button class="btn hidden" id="next">Next</button></div>
    </div>
    <div id="summary" class="summary hidden"></div>
  </section>

  <section id="list" class="hidden">
    <ul class="word-list" id="wordList"></ul>
  </section>

  <footer>Made for Mr. Dunlap's class. The list is updated each week.</footer>
</main>

<script>
/* ---------- WORD LIST: edit here, then push the file ----------
   Format: ["Word", "part of speech", "definition"]              */
const WORDS = [
  ["Cagey","adj.","unwilling to give information"],
  ["Sanctimonious","adj.","making a show of being morally superior to other people"],
  ["Inscrutable","adj.","impossible to understand or interpret"],
  ["Genteel","adj.","polite, refined, respectable"],
  ["Bawdiness","n.","(of behavior) indecent, obscene"],
  ["Solidarity","n.","unity among people with a common interest"],
  ["Coy","adj.","intentionally keeping something secret; (especially of women) being or pretending to be shy, or like a child"],
  ["Wheedle","v.","using praise or charm in order to persuade someone to do something"],
  ["Consummation","n.","the act of making something complete or perfect"],
  ["Dexterity","n.","the ability to perform a difficult action quickly and skillfully"],
  ["Dole","v.","distribute shares of something"],
  ["Contrivance","n.","a thing which is created skillfully and inventively to serve a particular purpose"],
  ["Recrimination","n.","an accusation in response to one from someone else"],
  ["Skittish","adj.","(of an animal, especially a horse) nervous or excitable; easily scared"],
  ["Aplomb","n.","self-confidence or assurance, especially when in a demanding situation"],
  ["Affected","adj.","assumed artificially; unnatural; feigned"],
  ["Bile","n.","anger; irritability"],
  ["Irate","adj.","angry"],
  ["Bluster","n./v.","to be loud, noisy, or swaggering"],
  ["Deliberation","n.","careful consideration before decision"],
  ["Flout","v.","to openly and deliberately disobey or disregard a rule, law, or convention"],
  ["Circumvent","v.","to find a clever or sneaky way around a rule, obstacle, or problem"],
  ["Hovel","n.","a small, poorly built, and often dirty or cramped house or shed"],
  ["Indigent","adj.","extremely poor and lacking the basic necessities of life, such as food, clothing, and shelter"],
  ["Leer","n.","an unpleasant, sidelong look or smile that shows creepy sexual interest, malicious intent, or scorn"],
  ["Woebegone","adj.","looking or feeling very sad"],
  ["Frantic","adj.","emotionally out of control, especially feeling or showing fear or anxiety"],
  ["Fleece","v.","to gain money by swindling"],
  ["Pretense","n.","a false show"],
  ["Gall","n.","bold, disrespectful behavior"]
];
/* --------------------------------------------------------------- */

const $ = id => document.getElementById(id);
let mode = "regular", deck = [], i = 0, done = false, tries = 0;
let score = 0, missed = [], sentences = [];

const RULES = {
  regular: "You get a word. Use it correctly in a sentence, then compare with the definition.",
  round: "You get a definition. Type the word it describes. Spelling counts.",
  list: "Every word currently on the list, in alphabetical order."
};

function shuffle(a) { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; }
function norm(s) { return s.trim().toLowerCase().replace(/[^a-z]/g, ""); }
function stem(w) { w = norm(w); return w.length > 5 ? w.slice(0, w.length - 2) : w.slice(0, Math.max(3, w.length - 1)); }
function feedback(kind, msg) { $("fb").className = "fb " + kind; $("fb").textContent = msg; }

/* ---------- Quiz ---------- */
function start(list) {
  deck = shuffle(list); i = 0; score = 0; missed = []; sentences = [];
  $("summary").classList.add("hidden"); $("play").classList.remove("hidden");
  show();
}

function show() {
  const [w, pos, def] = deck[i];
  done = false; tries = 0;
  $("pos").textContent = pos;
  $("fb").className = "fb"; $("fb").textContent = "";
  $("next").classList.add("hidden");
  $("prog").textContent = (i + 1) + " of " + deck.length;
  $("bar").style.width = Math.round(i / deck.length * 100) + "%";
  if (mode === "regular") {
    $("regularUI").classList.remove("hidden"); $("roundUI").classList.add("hidden");
    $("prompt").innerHTML = '<span class="word"></span>';
    $("prompt").querySelector(".word").textContent = w;
    $("sentence").value = ""; $("sentence").disabled = false;
    $("defBox").classList.add("hidden"); $("defBox").textContent = def;
    $("score").textContent = sentences.length + " written";
    $("sentence").focus();
  } else {
    $("roundUI").classList.remove("hidden"); $("regularUI").classList.add("hidden");
    $("prompt").innerHTML = '<span class="definition"></span>';
    $("prompt").querySelector(".definition").textContent = def;
    $("guess").value = ""; $("guess").disabled = false;
    $("score").textContent = score + " right first try";
    $("guess").focus();
  }
}
function finish() { done = true; $("next").classList.remove("hidden"); $("next").focus(); }

$("checkSentence").onclick = () => {
  if (done) return;
  const [w, , def] = deck[i];
  const s = $("sentence").value;
  if (norm(s).length < 4) { feedback("bad", "Write a sentence first."); return; }
  if (!norm(s).includes(stem(w))) { feedback("bad", "Your sentence needs to include \"" + w + "\"."); return; }
  if (s.trim().split(/\s+/).length < 5) { feedback("bad", "Make it a full sentence, at least five words."); return; }
  sentences.push([w, s.trim()]);
  $("sentence").disabled = true;
  $("defBox").classList.remove("hidden");
  feedback("note", "Definition: " + def + " Does your sentence fit that meaning?");
  finish();
};
$("peekDef").onclick = () => $("defBox").classList.toggle("hidden");
$("skipWord").onclick = () => { if (!done) missed.push(deck[i]); advance(); };

$("checkGuess").onclick = () => {
  if (done) return;
  const [w] = deck[i];
  const g = $("guess").value;
  if (!norm(g)) { feedback("bad", "Type a word first."); return; }
  tries++;
  if (norm(g) === norm(w)) {
    if (tries === 1) score++; else missed.push(deck[i]);
    $("guess").disabled = true;
    feedback("ok", "Right: " + w + (tries > 1 ? " (took " + tries + " tries)" : ""));
    $("score").textContent = score + " right first try";
    finish();
  } else { feedback("bad", "Not it. Try again or reveal."); $("guess").select(); }
};
$("revealWord").onclick = () => {
  if (done) return;
  missed.push(deck[i]); $("guess").disabled = true;
  feedback("bad", "The word is " + deck[i][0] + ".");
  finish();
};

function advance() { i++; if (i < deck.length) show(); else summary(); }
$("next").onclick = advance;

function summary() {
  $("play").classList.add("hidden");
  $("bar").style.width = "100%"; $("prog").textContent = "Done";
  const s = $("summary"); s.classList.remove("hidden"); s.innerHTML = "";
  const h = document.createElement("h2"), p = document.createElement("p");
  if (mode === "regular") {
    h.textContent = "You wrote " + sentences.length + " sentences";
    p.textContent = missed.length ? "Skipped: " + missed.map(m => m[0]).join(", ") : "No skips.";
    s.append(h, p);
    const ul = document.createElement("ul"); ul.className = "sentences";
    sentences.forEach(([w, t]) => { const li = document.createElement("li"), b = document.createElement("b"); b.textContent = w + ": "; li.append(b, t); ul.append(li); });
    s.append(ul);
  } else {
    h.textContent = score + " of " + deck.length + " on the first try";
    p.textContent = missed.length ? "Review these: " + missed.map(m => m[0]).join(", ") : "Perfect run.";
    s.append(h, p);
  }
  const row = document.createElement("div"); row.className = "row";
  if (missed.length) { const b = document.createElement("button"); b.className = "btn primary"; b.textContent = "Redo missed words"; const m = missed.slice(); b.onclick = () => start(m); row.append(b); }
  const r = document.createElement("button"); r.className = "btn"; r.textContent = "Restart all"; r.onclick = () => start(WORDS); row.append(r);
  s.append(row);
}

$("guess").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); done ? advance() : $("checkGuess").click(); } });
$("sentence").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); done ? advance() : $("checkSentence").click(); } });

/* ---------- Word list (read-only) ---------- */
function renderList() {
  const ul = $("wordList"); ul.innerHTML = "";
  WORDS.slice().sort((a, b) => a[0].localeCompare(b[0])).forEach(([w, pos, def]) => {
    const li = document.createElement("li"), b = document.createElement("b"), sp = document.createElement("span");
    b.textContent = w + (pos ? " (" + pos + ")" : ""); sp.textContent = def;
    li.append(b, sp); ul.append(li);
  });
}

/* ---------- Tabs ---------- */
function setMode(m) {
  mode = m;
  ["Regular", "Round", "List"].forEach(t => $("tab" + t).setAttribute("aria-selected", t.toLowerCase() === m));
  $("rules").textContent = RULES[m];
  if (m === "list") { $("quiz").classList.add("hidden"); $("list").classList.remove("hidden"); renderList(); }
  else { $("list").classList.add("hidden"); $("quiz").classList.remove("hidden"); start(WORDS); }
}
$("tabRegular").onclick = () => setMode("regular");
$("tabRound").onclick = () => setMode("round");
$("tabList").onclick = () => setMode("list");

$("count").textContent = WORDS.length + " words";
setMode("regular");
</script>
</body>
</html>
